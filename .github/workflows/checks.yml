name: Repository checks

# Three cheap, deterministic checks: broken relative links, punctuation
# AGENTS.md rules out, and an evaluation whose stated score disagrees with its
# own breakdown table. They confirm arithmetic, links and punctuation only.
# They cannot judge whether a score is the right score.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run repository checks
        run: python3 .github/scripts/repo_checks.py

      - name: Set up Node for assessment tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Test existing Python checker
        working-directory: tools/pilot-readiness
        run: python3 -m unittest discover -s tests -v

      - name: Test browser and Python decision parity
        run: |
          npm ci
          npm test

      - name: Install test browser
        run: npx playwright install --with-deps chromium

      - name: Test assessment journeys and local PDF downloads
        run: |
          python3 -m http.server 8765 --directory docs > /tmp/pilot-preview.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://localhost:8765/pilot-readiness/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:browser

      - name: Inspect V2 report text and bounds
        run: |
          python3 -m pip install pdfplumber==0.11.9
          npm run test:pdf

      - name: Check V2 scenario comparison
        run: npm run test:compare

      - name: Retain browser validation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-readiness-browser-checks
          path: test-results/
          if-no-files-found: ignore
